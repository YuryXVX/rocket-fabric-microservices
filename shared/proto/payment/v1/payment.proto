syntax = "proto3";

package payment.v1;

option go_package = "shared/pkg/proto/payment/v1";

// Сервис для обработки платежей
service BillingService {
  // Обрабатывает команду на оплату и возвращает transaction_uuid.
  //
  // Ошибки:
  // - INVALID_ARGUMENT: Некорректный order_uuid или невалидный/неуказанный payment_method
  rpc PayOrder(PayOrderRequest) returns (PayOrderResponse);
}

// Запрос на оплату заказа
message PayOrderRequest {
  // UUID заказа (обязательный)
  string order_uuid = 1;

  // Выбранный способ оплаты (обязательный)
  PaymentMethod payment_method = 2;
}

// Ответ на запрос оплаты
message PayOrderResponse {
  // UUID транзакции оплаты
  string transaction_uuid = 1;
}

// Метод оплаты
enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CARD = 1;
  PAYMENT_METHOD_SBP = 2;
  PAYMENT_METHOD_CREDIT_CARD = 3;
  PAYMENT_METHOD_INVESTOR_MONEY = 4;
}

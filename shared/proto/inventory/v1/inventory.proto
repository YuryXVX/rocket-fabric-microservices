syntax = "proto3";

package inventory.v1;

import "google/protobuf/timestamp.proto";

option go_package = "shared/pkg/proto/inventory/v1";

service PartService {
  // Возвращает информацию о детали по её UUID.
  //
  // Ошибки:
  // - NOT_FOUND: Деталь с таким UUID не найдена
  // - INVALID_ARGUMENT: Некорректный формат UUID
  rpc GetPartByUUID(GetPartByUUIDRequest) returns (GetPartByUUIDResponse);

  // Возвращает список деталей с возможностью фильтрации по типу или по конкретным UUID.
  //
  // Ошибки:
  // - NOT_FOUND: Одна или несколько деталей из uuids не найдены
  // - INVALID_ARGUMENT: Невалидный формат UUID в списке uuids
  rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
}

// Запрос для получения списка деталей
message ListPartsRequest {
  // Фильтр по типу. Если передано PART_TYPE_UNSPECIFIED, фильтр по типу игнорируется (все детали).
  PartType part_type = 1;

  // Опционально: конкретные UUID. Имеет приоритет над part_type.
  // В proto3 массивы задаются ключевым словом repeated.
  repeated string uuids = 2;
}

// Ответ со списком деталей
message ListPartsResponse {
  // Список найденных деталей
  repeated Part parts = 1;
}

// Запрос получения детали
message GetPartByUUIDRequest {
  // Идентификатор детали
  string uuid = 1;
}

// Ответ с информацией о детали
message GetPartByUUIDResponse {
  // Информация о детали
  Part part = 1;
}

// Информация о детали
message Part {
  // uuid уникальный идентификатор детали
  string uuid = 1;
  // name назавние детали
  string name = 2;
  // description oписание детали
  string description = 3;
  // price цена в копейках  (5000₽ = 500000)
  int64 price = 4;
  // stock_quantity количество на складе
  int64 stock_quantity = 5;
  // created_at дата создания
  google.protobuf.Timestamp created_at = 6;
  // part_type тип детали (enum)
  PartType part_type = 7;
}

// enum тип детали
enum PartType {
  // Не указан (дефолтное значение)
  PART_TYPE_UNSPECIFIED = 0;
  // Корпус корабля
  PART_TYPE_HULL = 1;
  // Двигатель
  PART_TYPE_ENGINE = 2;
  // Защитный щит
  PART_TYPE_SHIELD = 3;
  // Вооружение
  PART_TYPE_WEAPON = 4;
}
